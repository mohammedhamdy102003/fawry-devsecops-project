apiVersion: apps/v1
kind: Deployment
metadata:
  name: fawry-backend
  namespace: backend-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fawry-backend
  template:
    metadata:
      labels:
        app: fawry-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-helper
      containers:
      - name: backend
        image: 374862008657.dkr.ecr.us-east-1.amazonaws.com/fawry-devsecops-prod-fawry-backend:latest
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: mysql-root-password
